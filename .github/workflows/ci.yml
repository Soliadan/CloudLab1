name: Checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.10
        env:
          POSTGRES_DB: cloudlab_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: isolated-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test -d cloudlab_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://test:isolated-ci-only@localhost:5432/cloudlab_test
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        env:
          DB_PASSWORD: ci-validation-only
        run: docker compose config --quiet
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: ruff check perfume_backend tests --select E9,F63,F7,F82
      - run: python -m pytest -q
      - run: docker build -t cloudlab1:${{ github.sha }} perfume_backend
      - name: Smoke-test image as non-root with schema bootstrap
        env:
          DB_PASSWORD: isolated-ci-only
        run: |
          set -euo pipefail
          trap 'docker rm -f api-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name api-smoke --network host \
            -e DB_HOST=127.0.0.1 -e DB_PORT=5432 -e DB_NAME=cloudlab_test \
            -e DB_USER=test -e DB_PASSWORD -e APP_VERSION=ci-smoke \
            cloudlab1:${{ github.sha }}
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8088/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8088/health | python3 -c 'import json, sys; assert json.load(sys.stdin)["version"] == "ci-smoke"'
          test "$(docker inspect -f '{{.Config.User}}' api-smoke)" = "10001"
  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [infra]
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.16.6'
      - run: terraform -chdir=${{ matrix.directory }} fmt -check
      - run: terraform -chdir=${{ matrix.directory }} init -backend=false -lockfile=readonly
      - run: terraform -chdir=${{ matrix.directory }} validate
