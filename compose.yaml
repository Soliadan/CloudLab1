
services:
  db:
    image: postgres:16.10
    container_name: cloudlab-postgres
    environment:
      POSTGRES_DB: tasks_db
      POSTGRES_USER: tasks_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./perfume_backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks_user -d tasks_db"]
      interval: 5s
      retries: 5

  api:
    build: ./perfume_backend
    container_name: cloudlab-api
    ports:
      - "127.0.0.1:8088:8088"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: tasks_db
      DB_USER: tasks_user
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health', timeout=6)"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
